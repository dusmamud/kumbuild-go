services:
  postgres:
    image: postgres:16-alpine
    container_name: kumbuild-postgres
    restart: always
    environment:
      POSTGRES_DB: kumbuild_orders
      POSTGRES_USER: kumbuild
      POSTGRES_PASSWORD: kumbuild
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
